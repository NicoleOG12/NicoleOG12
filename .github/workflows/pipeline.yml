name: 🌸 Check GitHub Profile Cards

# Apenas VALIDA se os cards da Vercel usados no README estão respondendo
# e não estão devolvendo um SVG de erro (os serviços respondem HTTP 200 mesmo
# com erro). Não altera o README nem publica nada.
# Se algum card falhar, o job fica vermelho e o GitHub avisa por e-mail.

on:
  schedule:
    - cron: "0 */6 * * *"

  # Permite executar manualmente pelo GitHub
  workflow_dispatch:

  # Valida ao mexer neste workflow
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pipeline.yml"

permissions:
  contents: read

concurrency:
  group: check-profile-cards
  cancel-in-progress: false

jobs:
  check:
    name: 🔎 Check profile cards
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: 🔎 Validar cards
        run: |
          USER_NAME="NicoleOG12"
          ATTEMPTS=3
          ERROR_REGEX="Failed to retrieve|Can't fetch any contribution|Something went wrong|Could not fetch|Could not resolve|rate limit|Maximum retries|Missing params|Please check your username|Unknown error"

          CARDS=(
            "🔥 Streak Stats|https://github-readme-streak-stats-dvgo.vercel.app/?user=${USER_NAME}"
            "📈 Activity Graph|https://github-readme-activity-graph-topaz-mu.vercel.app/graph?username=${USER_NAME}&theme=github-compact"
            "📊 GitHub Stats|https://github-readme-stats-eta-bay-80.vercel.app/api?username=${USER_NAME}&show_icons=true"
            "💻 Top Languages|https://github-readme-stats-eta-bay-80.vercel.app/api/top-langs/?username=${USER_NAME}&layout=compact"
          )

          failed=0

          for entry in "${CARDS[@]}"; do
            name="${entry%%|*}"
            url="${entry#*|}"
            ok=0

            for attempt in $(seq 1 "$ATTEMPTS"); do
              status=$(curl -sL -m 40 -o card.svg -w "%{http_code}" "$url" || echo 000)

              if [ "$status" = "200" ] && grep -q "<svg" card.svg && ! grep -qiE "$ERROR_REGEX" card.svg; then
                ok=1
                break
              fi

              echo "  $name: tentativa $attempt/$ATTEMPTS falhou (HTTP $status)"
              sleep $((attempt * 10))
            done

            if [ "$ok" = "1" ]; then
              echo "✅ $name: OK"
            else
              echo "::error::$name está fora do ar ou devolvendo erro. URL: $url"
              failed=1
            fi
          done

          exit "$failed"
