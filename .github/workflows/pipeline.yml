name: 🌸 Refresh GitHub Profile Stats

on:
  schedule:
    - cron: "0 */6 * * *"

  # Permite executar manualmente pelo GitHub
  workflow_dispatch:

  # Atualiza ao mexer no script ou no workflow
  push:
    branches:
      - main
    paths:
      - ".github/scripts/fetch-cards.sh"
      - ".github/workflows/pipeline.yml"

permissions:
  contents: write

concurrency:
  group: refresh-profile-stats
  cancel-in-progress: false

jobs:
  refresh:
    name: 🔄 Refresh profile cards
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout main
        uses: actions/checkout@v4

      - name: 🌿 Preparar branch "cards"
        run: |
          if git ls-remote --exit-code --heads origin cards >/dev/null 2>&1; then
            git fetch origin cards
            git worktree add -B cards ../cards-branch origin/cards
          else
            git worktree add --detach ../cards-branch
            git -C ../cards-branch checkout --orphan cards
            git -C ../cards-branch rm -rf . >/dev/null 2>&1 || true
          fi

      - name: 🔄 Baixar e validar os cards
        run: bash .github/scripts/fetch-cards.sh ../cards-branch

      - name: 🚀 Publicar na branch "cards"
        working-directory: ../cards-branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma mudança nos cards."
            exit 0
          fi
          git commit -m "chore: atualiza cards do perfil"
          git push origin cards
