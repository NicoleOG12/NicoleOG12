name: 🌸 Check GitHub Profile Cards

# Verifica se os cards da Vercel usados no README estão respondendo.
# Se algum cair, tenta recuperar (novas tentativas e, se configurado, redeploy
# na Vercel). Quando o card volta, atualiza o &v= da URL no README, faz commit
# e push para o GitHub descartar a cópia de erro que guardou em cache.

on:
  schedule:
    - cron: "0 * * * *"

  # Permite executar manualmente pelo GitHub
  workflow_dispatch:

  # Valida ao mexer na pipeline
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pipeline.yml"
      - ".github/scripts/check-cards.sh"

permissions:
  contents: write

concurrency:
  group: check-profile-cards
  cancel-in-progress: false

jobs:
  check:
    name: 🔎 Check profile cards
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔎 Verificar e recuperar cards
        id: check
        continue-on-error: true
        env:
          # Opcionais: Deploy Hooks da Vercel (Project → Settings → Git → Deploy Hooks)
          HOOK_STREAK: ${{ secrets.VERCEL_STREAK_HOOK }}
          HOOK_ACTIVITY: ${{ secrets.VERCEL_ACTIVITY_HOOK }}
          HOOK_STATS: ${{ secrets.VERCEL_STATS_HOOK }}
        run: bash .github/scripts/check-cards.sh README.md

      - name: 🚀 Commit e push
        run: |
          if git diff --quiet -- README.md; then
            echo "Nenhuma mudança no README."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "fix: refresh profile cards cache"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: ❌ Falhar se algum card não se recuperou
        if: steps.check.outcome == 'failure'
        run: |
          echo "::error::Algum card continua fora do ar. Veja os logs do passo de verificação."
          exit 1
