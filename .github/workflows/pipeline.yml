name: 🌸 Refresh GitHub Profile Stats

on:
  schedule:
    # 03:00 no horário de Brasília (UTC-3)
    - cron: "0 6 * * *"

  # Permite executar manualmente pelo GitHub
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-profile-stats
  cancel-in-progress: false

jobs:
  refresh:
    name: 🔄 Refresh profile cards
    runs-on: ubuntu-latest

    steps:
      - name: 🌸 Start
        run: |
          echo "=========================================="
          echo "🌸 GitHub Profile Stats Refresh"
          echo "=========================================="
          echo "Iniciando atualização dos cards..."
          echo ""

      # ==========================================
      # 🔥 STREAK STATS
      # ==========================================

      - name: 🔥 Refresh Streak Stats
        env:
          VERCEL_HOOK: ${{ secrets.VERCEL_STREAK_HOOK }}
        run: |
          echo "🔥 Atualizando Streak Stats..."

          if [ -z "$VERCEL_HOOK" ]; then
            echo "❌ Secret VERCEL_STREAK_HOOK não configurado."
            exit 1
          fi

          HTTP_STATUS=$(curl \
            -s \
            -o /dev/null \
            -w "%{http_code}" \
            -X POST \
            "$VERCEL_HOOK")

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Streak Stats: redeploy iniciado."
          else
            echo "❌ Streak Stats: erro ao iniciar redeploy."
            echo "HTTP Status: $HTTP_STATUS"
            exit 1
          fi

      # ==========================================
      # 📈 ACTIVITY GRAPH
      # ==========================================

      - name: 📈 Refresh Activity Graph
        env:
          VERCEL_HOOK: ${{ secrets.VERCEL_ACTIVITY_HOOK }}
        run: |
          echo "📈 Atualizando Activity Graph..."

          if [ -z "$VERCEL_HOOK" ]; then
            echo "❌ Secret VERCEL_ACTIVITY_HOOK não configurado."
            exit 1
          fi

          HTTP_STATUS=$(curl \
            -s \
            -o /dev/null \
            -w "%{http_code}" \
            -X POST \
            "$VERCEL_HOOK")

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Activity Graph: redeploy iniciado."
          else
            echo "❌ Activity Graph: erro ao iniciar redeploy."
            echo "HTTP Status: $HTTP_STATUS"
            exit 1
          fi

      # ==========================================
      # 📊 GITHUB STATS + TOP LANGUAGES
      # ==========================================

      - name: 📊 Refresh GitHub Stats
        env:
          VERCEL_HOOK: ${{ secrets.VERCEL_STATS_HOOK }}
        run: |
          echo "📊 Atualizando GitHub Stats e Top Languages..."

          if [ -z "$VERCEL_HOOK" ]; then
            echo "❌ Secret VERCEL_STATS_HOOK não configurado."
            exit 1
          fi

          HTTP_STATUS=$(curl \
            -s \
            -o /dev/null \
            -w "%{http_code}" \
            -X POST \
            "$VERCEL_HOOK")

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ GitHub Stats: redeploy iniciado."
            echo "✅ Top Languages: será atualizado pelo mesmo deployment."
          else
            echo "❌ GitHub Stats: erro ao iniciar redeploy."
            echo "HTTP Status: $HTTP_STATUS"
            exit 1
          fi

      # ==========================================
      # ✅ FINAL
      # ==========================================

      - name: 🌸 Finish
        run: |
          echo ""
          echo "=========================================="
          echo "✨ Atualização concluída!"
          echo "=========================================="
          echo ""
          echo "🔥 Streak Stats → redeploy solicitado"
          echo "📈 Activity Graph → redeploy solicitado"
          echo "📊 GitHub Stats → redeploy solicitado"
          echo "💻 Top Languages → redeploy solicitado"
          echo ""
          echo "🐍 Pacman não foi alterado porque possui"
          echo "   sua própria GitHub Action."
